<!--
  Image de partage (Open Graph) — 1200 x 630.
  Le canevas est carré (1200x1200) avec le visuel centré verticalement,
  parce que l'outil de rendu macOS (qlmanage) force une sortie carrée :
  on recadre ensuite au centre en 1200x630 avec `sips`. Voir README.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" width="1200" height="1200">
  <defs>
    <radialGradient id="glow" cx="50%" cy="24%" r="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="1200" fill="#0a0a0a"/>

  <!-- Zone visible après recadrage : y de 285 à 915 -->
  <g transform="translate(0, 285)">
    <rect y="0" width="1200" height="630" fill="url(#glow)"/>

    <!-- Marque Kyroz (outline dark), 512 -> 96 px -->
    <g transform="translate(96, 74) scale(0.1875)" fill="none" stroke="#ffffff" stroke-width="14" stroke-linejoin="round" stroke-linecap="round">
      <path d="M410.74 100.11 Q423.50 87.40 405.51 87.84 L319.61 89.89 Q301.62 90.32 288.91 103.07 L100.48 292.15 Q87.77 304.90 87.66 322.90 L87.15 404.41 Q87.04 422.41 99.80 409.71 Z"/>
      <path d="M250.04 323.51 Q236.66 335.55 247.50 349.93 L292.97 410.22 Q303.81 424.60 321.81 424.60 L406.96 424.60 Q424.96 424.60 413.48 410.73 L313.82 290.30 Q302.35 276.44 288.97 288.48 Z"/>
      <path d="M187.98 105.40 Q187.76 87.40 169.76 87.40 L105.77 87.40 Q87.77 87.40 87.68 105.40 L87.13 223.40 Q87.04 241.40 100.19 229.11 L175.34 158.82 Q188.49 146.52 188.27 128.52 Z"/>
    </g>

    <text x="196" y="142" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
          font-size="40" font-weight="700" letter-spacing="-1.2" fill="#ffffff">Kyroz</text>

    <text x="96" y="310" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
          font-size="62" font-weight="700" letter-spacing="-2.4" fill="#ffffff">Ton plan nutrition.</text>
    <text x="96" y="382" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
