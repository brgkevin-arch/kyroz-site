    <rect x="96" y="494" width="290" height="44" rx="22" fill="none" stroke="#ffffff" stroke-opacity="0.22"/>
    <circle cx="121" cy="516" r="4" fill="#ffffff" fill-opacity="0.55"/>
    <text x="137" y="524" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
          font-size="19" font-weight="500" fill="#a5a5a5">Bientôt sur iOS et Android</text>
  </g>
</svg>
