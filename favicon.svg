<!--
  Favicon (onglet du navigateur).

  Deux partis pris, tous deux dictés par la taille réelle d'affichage (16 px) :

  1. FOND TRANSPARENT — plus de carré derrière la marque : l'icône épouse la
     couleur de l'onglet, quelle qu'elle soit.
  2. MARQUE PLEINE, pas en outline — à 16 px les traits fins du logo outline
     se referment en une tache illisible. La version pleine tient la taille.
     Le site, lui, garde bien la version outline.

  La couleur suit le thème du navigateur : encre en clair, blanc en sombre.

  ⚠️ La couleur par défaut est portée par l'ATTRIBUT `fill` du groupe, pas par le
  CSS : certains moteurs de rendu simples ignorent le bloc <style> et, sans cet
  attribut, dessinent une icône VIDE. Le CSS ne fait que surcharger en thème
  sombre — un attribut de présentation a la priorité la plus faible, donc le CSS
  gagne partout où il est compris. Ne pas déplacer cette couleur dans le <style>.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="72 72 366 366">
  <style>
    @media (prefers-color-scheme: dark) { .mark { fill: #ffffff; } }
  </style>
  <g class="mark" fill="#0a0a0a" fill-rule="evenodd">
    <path d="M428.58 82.30 L303.00 85.30 L82.67 306.38 L81.92 427.45 Z"/>
    <path d="M236.07 337.96 L305.25 429.70 L430.08 429.70 L303.75 277.06 Z"/>
    <path d="M185.69 82.30 L82.67 82.30 L81.92 240.96 L186.44 143.21 Z"/>
  </g>
</svg>
